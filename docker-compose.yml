services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: appointmentscheduler:local
    ports:
      - "8080:8080"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://appointmentscheduler_db:3306/appointmentscheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      BASE_URL: http://localhost:8080
    depends_on:
      appointmentscheduler_db:
        condition: service_healthy
    networks:
      - appointmentscheduler_network

  appointmentscheduler_db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: appointmentscheduler
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - appointmentscheduler_volume:/var/lib/mysql
    networks:
      - appointmentscheduler_network

volumes:
  appointmentscheduler_volume:

networks:
  appointmentscheduler_network:
