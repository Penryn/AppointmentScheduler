<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'','选择服务')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<body th:remove="tag">
<div class="page-header">
    <div>
        <h1>选择服务</h1>
        <p>选择本次预约需要的服务项目。</p>
    </div>
</div>
<div class="booking-steps"><span>1 选择服务人员</span><span class="active">2 选择服务</span><span>3 选择时间</span><span>4 确认预约</span></div>
<div class="content-panel">
        <div class="table-responsive">
            <table id="customers" class="table table-striped text-center">
                <thead class="table-dark">
                <tr>
                    <th>服务名称</th>
                    <th>时长</th>
                    <th>价格</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${works == null}">
                    <td colspan="4">暂无可选服务</td>
                </tr>
                <tr th:each="work : ${works}">
                    <td><span th:text="${work.name}"> 服务名称 </span></td>
                    <td><span th:text="${work.duration + ' 分钟'}"> 30 分钟 </span></td>
                    <td><span th:text="${work.price + ' PLN'}"> 3 PLN </span></td>
                    <td><a class="btn btn-primary"
                           th:href="@{'/appointments/new/'+${providerId} +'/'+ ${work.id}}"
                           role="button">选择</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

</div>
</body>

</html>
