<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'appointments','确认预约')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<body th:remove="tag">
<div class="page-header">
    <div>
        <h1>确认预约</h1>
        <p>请核对预约信息，确认无误后提交。</p>
    </div>
</div>
<div class="booking-steps"><span>1 选择服务人员</span><span>2 选择服务</span><span>3 选择时间</span><span class="active">4 确认预约</span></div>

<div class="row justify-content-center">
    <div class="col-md-6 mt-3">

        <table class="table content-panel">
            <thead>
            <tr class="text-center">
                <td colspan="2">
                    <h3>预约信息确认</h3>
                </td>
            </tr>
            </thead>

            <tr>
                <td><b>日期</b></td>
                <td><span th:text="${#temporals.format(start, 'dd-MM-yyyy')}">10-01-2019</span></td>
            </tr>
            <tr>
                <td><b>时间</b></td>
                <td><span th:text="${#temporals.format(start, 'HH:mm')+' - '+ #temporals.format(end, 'HH:mm')}">14:00 - 15:00</span>
                </td>
            </tr>
            <tr>
                <td><b>服务人员</b></td>
                <td><span th:text="${provider}">Marian Nowak</span></td>
            </tr>

            <tr>
                <td><b>服务</b></td>
                <td><span th:text="${work.name}"> english </span></td>
            </tr>
            <tr>
                <td><b>说明</b></td>
                <td><span th:text="${work.description}">description</span></td>
            </tr>

            <tr>
                <td><b>价格</b></td>
                <td><span th:text="${work.price}"> 50 </span> PLN</td>
            </tr>

            <tr>
                <td><b>客户可取消</b></td>
                <td><p th:text="${work.editable ? '是':'否，仅服务人员可取消'}">是</p></td>
            </tr>
            <tr class="text-center">
                <td colspan="2">
                    <form th:action="@{/appointments/new}" method="POST">
                        <input type="hidden" name="workId" th:value="${work.id}">
                        <input type="hidden" name="providerId" th:value="${providerId}">
                        <input type="hidden" name="start" th:value="${start}">


                        <button type="submit" class="btn btn-primary">确认预约</button>
                    </form>

                </td>
            </tr>
        </table>


    </div>

</div>

</body>


</html>
