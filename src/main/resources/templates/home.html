<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home','我的日程')}"
>

<body th:remove="tag">
<script defer th:src="@{/js/vendor/fullcalendar.global.min.js}"
        integrity="sha384-cdgKlW4XCZfQ8yQFLScLHBujFrHf3sMYBPBjRimt2H/ut44fe4t/PUk3luazptar"></script>
<script defer th:src="@{/js/home-calendar.js}"
        integrity="sha384-dIcyXwjvgJqU/1FyZbAoCu5QbBePuxKUyZsa1tqbg3Ctl3Tyt9Iz43Y9J+GiK6Ah"></script>

<div class="page-header">
    <div>
        <h1>我的日程</h1>
        <p>查看近期预约安排，点击日程可进入预约详情。</p>
    </div>
    <a class="btn btn-primary" th:href="@{/appointments/all}">查看全部预约</a>
</div>

<div class="row">
    <div class="col-12">
        <div class="calendar-panel">
            <div id="calendar" th:attr="data-events-url=@{'/api/user/'+${user.id}+'/appointments'}"></div>
        </div>
    </div>
</div>
</body>

</html>
