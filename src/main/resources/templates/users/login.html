<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body}, '','登录')}"
>
<body th:remove="tag">
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card">
            <div class="card-header">
                登录预约管理系统
            </div>
            <div class="card-body">
                <form id="login-form" th:action="@{/perform_login}" method='POST' class="form-horizontal">
                    <div th:if="${param.error != null}" class="alert alert-danger">
                        用户名或密码错误。
                    </div>
                    <div th:if="${createdUserName != null}" class="alert alert-success">
                        <p>用户 <span th:text="${createdUserName}"></span> 已创建。</p>
                    </div>
                    <div th:if="${param.logout != null}" class="alert alert-success">
                        <p>已退出登录。</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" class="form-control"
                               autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入密码"
                               class="form-control" autocomplete="current-password">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">登录</button>
                    </div>
                    <div class="mt-3 text-center">
                        <p class="mb-1">还没有账号？</p>
                        <p class="mb-0">创建 <a th:href="@{/customers/new/retail}">个人客户</a> 或 <a th:href="@{/customers/new/corporate}">企业客户</a> 账号</p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
