<!DOCTYPE html>
<html th:fragment="layout (content, activeLink, pageTitle)" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${pageTitle}">Page title</title>

    <!-- Appointment Chat CSS -->
    <link rel="stylesheet" th:href="@{/css/vendor/chat.css}"/>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}"/>
    <!-- Site CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap-notifications.css}"/>

    <!--jQuery-->
    <script defer th:src="@{/webjars/jquery/3.3.1-2/jquery.min.js}"></script>
    <!-- Bootstrap core JavaScript -->
    <script defer th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>

</head>

<body>

<!-- Navigation -->
<div sec:authorize="isAuthenticated()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
        <div class="container">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                    aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <th:block sec:authorize="hasRole('ROLE_CUSTOMER')">
                <!-- menu for customer-->
                <div th:replace="~{fragments/customer-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>

            <th:block sec:authorize="hasRole('ROLE_PROVIDER')">
                <!-- menu for provider-->
                <div th:replace="~{fragments/provider-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>

            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                <!-- menu for admin-->
                <div th:replace="~{fragments/admin-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>
            <!--notifications-->




            <!--notifications-->
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown dropdown-notifications open">
                        <a th:href="@{/notifications}" class="nav-link dropdown-toggle">
                            <span id="notifications-count" data-count="0" class="notification-bell"
                                  aria-label="Notification centre" role="img">&#128276;</span>
                        </a>
                    </li>
                    <li>
                        <p class="navbar-nav ml-auto navbar-text"> Logged as:
                            <span sec:authentication="name">username</span> | </p>
                    </li>
                    <li>
                        <form th:action="@{/perform_logout}" id="logout" method="POST">
                            <a class="nav-link" href="#"
                               onclick="document.getElementById('logout').submit(); return false;">Log out</a>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Page Content -->
<div class="container">
    <th:block th:insert="${content}"/>
    <div class="row align-items-center justify-content-center" style="margin-top: 50px">
        <p>AppointmentScheduler v<span th:text="${currentVersion}">1.0</span></p>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var notificationIndicator = document.getElementById('notifications-count');
        if (!notificationIndicator) {
            return;
        }

        var pollDelayMs = 30000;
        var pollHandle = null;

        function updateIndicator(count) {
            notificationIndicator.setAttribute('data-count', count);
            notificationIndicator.className = count > 0 ? 'notification-bell notification-icon' : 'notification-bell';
        }

        function scheduleNextPoll() {
            window.clearTimeout(pollHandle);
            if (document.hidden) {
                return;
            }
            pollHandle = window.setTimeout(fetchUnreadNotifications, pollDelayMs);
        }

        function fetchUnreadNotifications() {
            if (document.hidden) {
                return;
            }

            fetch('/api/user/notifications', {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('Notification polling failed with status ' + response.status);
                    }
                    return response.text();
                })
                .then(function (body) {
                    updateIndicator(Number(body) || 0);
                })
                .catch(function () {
                    updateIndicator(0);
                })
                .finally(scheduleNextPoll);
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                window.clearTimeout(pollHandle);
                return;
            }
            fetchUnreadNotifications();
        });

        fetchUnreadNotifications();
    });
</script>

</body>

</html>
