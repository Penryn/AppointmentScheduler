<!DOCTYPE html>
<html lang="zh-CN" th:fragment="layout (content, activeLink, pageTitle)" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${pageTitle}">预约管理系统</title>
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo.jpg}">

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <!-- Site CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>

    <!-- Bootstrap core JavaScript -->
    <script defer th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</head>

<body>

<!-- Navigation -->
<div sec:authorize="isAuthenticated()">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar static-top">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}">预约管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                    aria-controls="navbarResponsive" aria-expanded="false" aria-label="展开导航">
                <span class="navbar-toggler-icon"></span>
            </button>

            <th:block sec:authorize="hasRole('ROLE_CUSTOMER')">
                <!-- menu for customer-->
                <div th:replace="~{fragments/customer-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>

            <th:block sec:authorize="hasRole('ROLE_PROVIDER')">
                <!-- menu for provider-->
                <div th:replace="~{fragments/provider-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>

            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                <!-- menu for admin-->
                <div th:replace="~{fragments/admin-nav.html :: navlinks(${activeLink})}"></div>
            </th:block>
            <!--notifications-->




            <!--notifications-->
            <div class="navbar-actions">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a th:href="@{/notifications}" class="nav-link" title="通知">
                            <span id="notifications-count" data-count="0" class="notification-bell"
                                  aria-label="通知中心" role="img">&#128276;</span>
                        </a>
                    </li>
                    <li>
                        <p class="navbar-nav ms-auto navbar-text"> 当前用户：
                            <span sec:authentication="name">username</span></p>
                    </li>
                    <li>
                        <form th:action="@{/perform_logout}" id="logout" method="POST">
                            <a class="nav-link" href="#"
                               onclick="document.getElementById('logout').submit(); return false;">退出登录</a>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Page Content -->
<div class="container app-content">
    <th:block th:replace="${content}"/>
    <div class="app-footer">
        <p>AppointmentScheduler v<span th:text="${currentVersion}">1.0</span></p>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var notificationIndicator = document.getElementById('notifications-count');
        if (!notificationIndicator) {
            return;
        }

        var pollDelayMs = 30000;
        var pollHandle = null;

        function updateIndicator(count) {
            notificationIndicator.setAttribute('data-count', count);
            notificationIndicator.className = count > 0 ? 'notification-bell notification-icon' : 'notification-bell';
        }

        function scheduleNextPoll() {
            window.clearTimeout(pollHandle);
            if (document.hidden) {
                return;
            }
            pollHandle = window.setTimeout(fetchUnreadNotifications, pollDelayMs);
        }

        function fetchUnreadNotifications() {
            if (document.hidden) {
                return;
            }

            fetch('/api/user/notifications', {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('通知轮询失败，状态码：' + response.status);
                    }
                    return response.text();
                })
                .then(function (body) {
                    updateIndicator(Number(body) || 0);
                })
                .catch(function () {
                    updateIndicator(0);
                })
                .finally(scheduleNextPoll);
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                window.clearTimeout(pollHandle);
                return;
            }
            fetchUnreadNotifications();
        });

        fetchUnreadNotifications();
    });
</script>

</body>

</html>
