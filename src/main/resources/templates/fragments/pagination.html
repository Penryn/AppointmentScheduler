<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pager(page, path, query)"
     th:if="${page.totalPages > 1}"
     th:with="querySuffix=${query == null || #strings.isEmpty(query) ? '' : '&' + query}"
     aria-label="分页">
    <ul class="pagination justify-content-center mt-3">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="${page.first} ? '#' : @{|${path}?page=${page.number - 1}&size=${page.size}${querySuffix}|}">上一页</a>
        </li>
        <li class="page-item"
            th:each="pageNumber : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${pageNumber == page.number} ? 'active'">
            <a class="page-link"
               th:href="@{|${path}?page=${pageNumber}&size=${page.size}${querySuffix}|}"
               th:text="${pageNumber + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="${page.last} ? '#' : @{|${path}?page=${page.number + 1}&size=${page.size}${querySuffix}|}">下一页</a>
        </li>
    </ul>
</nav>
</body>
</html>
