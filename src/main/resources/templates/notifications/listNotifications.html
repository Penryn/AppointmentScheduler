<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'notifications','通知中心')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<body th:remove="tag">

<div class="page-header">
    <div>
        <h1>通知中心</h1>
        <p>查看系统通知并标记已读。</p>
    </div>
            <form th:action="@{/notifications/markAllAsRead}" id="markAllAsRead" method="POST">
                <a class="btn btn-success" href="#"
                   onclick="document.getElementById('markAllAsRead').submit(); return false;">全部标记为已读</a>
            </form>
</div>
<div class="content-panel">
    <div class="table-responsive">
        <table id="notifications" class="table table-striped text-center mt-2">

            <thead class="table-dark">

            <tr>
                <th>日期</th>
                <th>标题</th>
                <th>消息</th>
                <th>操作</th>
                <th>已读</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${notifications.empty}">
                <td colspan="5">暂无通知</td>
            </tr>
            <tr th:each="notification : ${notifications.content}">
                <td><span th:text="${#dates.format(notification.createdAt, 'dd-MMM-yyyy')}"> 01-01-2019 </span></td>
                <td><span th:text="${notification.title}"> New appointment </span></td>
                <td><span th:text="${notification.message}"> meesage</span></td>
                <td>
                    <form th:action="@{'/notifications/'+${notification.id}}" method="POST">
                        <button type="submit" class="btn btn-link p-0">查看</button>
                    </form>
                </td>
                <td><span th:text="${notification.isRead() ? '是' : '否'}">是</span></td>

            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${notifications}, '/notifications', '')}"></div>
    </div>

</div>
</body>
</html>
