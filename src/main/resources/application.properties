#
# JDBC properties
#
spring.datasource.url=jdbc:mysql://localhost:3306/appointmentscheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=7
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration
#
# async / scheduler properties
#
app.async.mail.core-pool-size=2
app.async.mail.max-pool-size=4
app.async.mail.queue-capacity=50
app.async.mail.await-termination-seconds=30
app.scheduling.enabled=true
app.scheduling.pool-size=2
app.scheduling.await-termination-seconds=30
#
# mail properties
#
mailing.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#
# JWT token secret in Base64
#
app.jwtSecret=QXBwb2ludG1lbnRTY2hlZHVsZXItQm9vdDMtSmFrYXJ0YS1IUzUxMi1TaWduaW5nLUtleS0yMDI2LTA0LTIzLURvLU5vdC1Vc2UtSW4tUHJvZHVjdGlvbg==

base.url=http://localhost:8080
app.security.cors.allowed-origins=http://localhost:8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.metrics.tags.application=appointmentscheduler

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
