#
# JDBC properties
#
spring.datasource.url=jdbc:mysql://localhost:3306/appointmentscheduler?useSSL=false&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=7
#
# async / scheduler properties
#
app.async.mail.core-pool-size=2
app.async.mail.max-pool-size=4
app.async.mail.queue-capacity=50
app.async.mail.await-termination-seconds=30
app.scheduling.pool-size=2
app.scheduling.await-termination-seconds=30
#
# mail properties
#
mailing.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#
# JWT token secret in Base64
#
app.jwtSecret=QXBwb2ludG1lbnRTY2hlZHVsZXItQm9vdDMtSmFrYXJ0YS1IUzUxMi1TaWduaW5nLUtleS0yMDI2LTA0LTIzLURvLU5vdC1Vc2UtSW4tUHJvZHVjdGlvbg==

base.url=http://localhost:8080

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=appointmentscheduler

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
