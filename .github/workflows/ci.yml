name: AppointmentScheduler CI

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - 'docs/**'
      - 'output/**'
      - 'target/**'
      - 'README.md'
      - 'LICENSE.md'
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - 'docs/**'
      - 'output/**'
      - 'target/**'
      - 'README.md'
      - 'LICENSE.md'
  workflow_dispatch:
    inputs:
      k6_warm_vus:
        description: Warm-up virtual users for the k6 performance test
        required: false
        default: '5'
      k6_peak_vus:
        description: Peak virtual users for the k6 performance test
        required: false
        default: '10'
      k6_ramp_up_duration:
        description: k6 ramp-up duration
        required: false
        default: '20s'
      k6_steady_duration:
        description: k6 steady-state duration
        required: false
        default: '40s'
      k6_ramp_down_duration:
        description: k6 ramp-down duration
        required: false
        default: '20s'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JACOCO_RETENTION_DAYS: '30'
  TEST_REPORT_RETENTION_DAYS: '14'
  JACOCO_ARTIFACT_PREFIX: 'jacoco-report'
  MAVEN_CLI_OPTS: '-B -ntp -Dmaven.wagon.http.retryHandler.count=3'
  MAVEN_OPTS: '-Xmx3072m'

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw $MAVEN_CLI_OPTS verify

      - name: Normalize JaCoCo artifact name
        if: always()
        id: jacoco-meta
        shell: bash
        run: |
          set -euo pipefail
          branch_raw="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_safe="${branch_raw//\//-}"
          branch_safe="$(echo "${branch_safe}" | tr ' ' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "${branch_safe}" ]; then
            branch_safe="unknown-branch"
          fi
          short_sha="${GITHUB_SHA::8}"
          artifact_name="${JACOCO_ARTIFACT_PREFIX}-${branch_safe}-r${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "JaCoCo artifact name: ${artifact_name}"

      - name: Upload JaCoCo report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jacoco-meta.outputs.artifact_name }}
          path: target/site/jacoco
          if-no-files-found: warn
          retention-days: ${{ env.JACOCO_RETENTION_DAYS }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  ui-test:
    name: UI Tests
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Selenium UI tests
        run: ./mvnw $MAVEN_CLI_OPTS -Pui-tests verify

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  performance-test:
    name: k6 Performance Test
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for application health... attempt ${attempt}/60"
            sleep 5
          done

          docker compose ps
          docker compose logs backend
          exit 1

      - name: Run k6 smoke load test
        shell: bash
        env:
          K6_WARM_VUS: ${{ github.event.inputs.k6_warm_vus || '5' }}
          K6_PEAK_VUS: ${{ github.event.inputs.k6_peak_vus || '10' }}
          K6_RAMP_UP_DURATION: ${{ github.event.inputs.k6_ramp_up_duration || '20s' }}
          K6_STEADY_DURATION: ${{ github.event.inputs.k6_steady_duration || '40s' }}
          K6_RAMP_DOWN_DURATION: ${{ github.event.inputs.k6_ramp_down_duration || '20s' }}
        run: |
          set -euo pipefail
          mkdir -p target/k6
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -v "${PWD}:/workspace" \
            -w /workspace \
            grafana/k6:0.49.0 run \
            --summary-export target/k6/summary.json \
            performance/k6/appointmentscheduler-smoke.js

      - name: Capture application logs
        if: always()
        shell: bash
        run: |
          mkdir -p target/k6
          docker compose logs > target/k6/docker-compose.log

      - name: Stop application stack
        if: always()
        shell: bash
        run: docker compose down -v

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/k6
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  publish-image:
    name: Publish Docker Image
    needs:
      - build-test
      - ui-test
      - performance-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and push image with Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "DOCKERHUB_USERNAME 或 DOCKERHUB_PASSWORD 未配置。"
            exit 1
          fi

          short_sha="${GITHUB_SHA::8}"
          ./mvnw $MAVEN_CLI_OPTS \
            -Djib.to.auth.username="${DOCKER_USERNAME}" \
            -Djib.to.auth.password="${DOCKER_PASSWORD}" \
            -Djib.to.tags="latest,${GITHUB_RUN_NUMBER},${short_sha}" \
            jib:build
