name: AppointmentScheduler CI

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - 'docs/**'
      - 'output/**'
      - 'target/**'
      - 'README.md'
      - 'LICENSE.md'
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - 'docs/**'
      - 'output/**'
      - 'target/**'
      - 'README.md'
      - 'LICENSE.md'
  workflow_dispatch:
    inputs:
      k6_warm_vus:
        description: Warm-up virtual users for the k6 performance test
        required: false
        default: '5'
      k6_peak_vus:
        description: Peak virtual users for the k6 performance test
        required: false
        default: '10'
      k6_ramp_up_duration:
        description: k6 ramp-up duration
        required: false
        default: '20s'
      k6_steady_duration:
        description: k6 steady-state duration
        required: false
        default: '40s'
      k6_ramp_down_duration:
        description: k6 ramp-down duration
        required: false
        default: '20s'
      k6_profile:
        description: k6 script profile to run
        required: false
        type: choice
        options:
          - smoke
          - load
        default: smoke
      k6_load_duration:
        description: k6 load profile duration
        required: false
        default: '5m'
      k6_customer_vus:
        description: Customer browsing VUs for the load profile
        required: false
        default: '20'
      k6_provider_vus:
        description: Provider dashboard VUs for the load profile
        required: false
        default: '5'
      k6_write_vus:
        description: Appointment write VUs for the load profile
        required: false
        default: '3'
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JACOCO_RETENTION_DAYS: '30'
  TEST_REPORT_RETENTION_DAYS: '14'
  JACOCO_ARTIFACT_PREFIX: 'jacoco-report'
  MAVEN_CLI_OPTS: '-B -ntp -Dmaven.wagon.http.retryHandler.count=3'
  MAVEN_OPTS: '-Xmx3072m'
  DEPENDENCY_CHECK_VERSION: '12.2.1'
  DEPENDENCY_CHECK_NVD_VALID_FOR_HOURS: '168'
  DEPENDENCY_CHECK_CACHE_EPOCH: '2026-05-01'
  K6_VERSION: '0.49.0'

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: file
          fail_level: error

  dependency-review:
    name: Dependency Review
    needs: workflow-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  build-test:
    name: Build and Test
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          read -r -a maven_args <<< "${MAVEN_CLI_OPTS}"
          ./mvnw "${maven_args[@]}" verify

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit and Integration Test Report
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Normalize JaCoCo artifact name
        if: always()
        id: jacoco-meta
        shell: bash
        run: |
          set -euo pipefail
          branch_raw="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_safe="${branch_raw//\//-}"
          branch_safe="$(printf '%s' "${branch_safe}" | tr ' ' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "${branch_safe}" ]; then
            branch_safe="unknown-branch"
          fi
          short_sha="${GITHUB_SHA::8}"
          artifact_name="${JACOCO_ARTIFACT_PREFIX}-${branch_safe}-r${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "JaCoCo artifact name: ${artifact_name}"

      - name: Upload JaCoCo report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jacoco-meta.outputs.artifact_name }}
          path: target/site/jacoco
          if-no-files-found: warn
          retention-days: ${{ env.JACOCO_RETENTION_DAYS }}

      - name: Publish JaCoCo report to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage
          update-comment: true
          comment-type: both

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  dependency-check:
    name: OWASP Dependency Check
    needs: build-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ env.DEPENDENCY_CHECK_CACHE_EPOCH }}

      - name: Run OWASP Dependency-Check
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          read -r -a maven_args <<< "${MAVEN_CLI_OPTS}"

          dependency_check_args=(
            "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check"
            "-DdataDirectory=${HOME}/.dependency-check"
            "-DnvdValidForHours=${DEPENDENCY_CHECK_NVD_VALID_FOR_HOURS}"
            "-DnvdApiResultsPerPage=2000"
            "-Dformat=ALL"
            "-DfailBuildOnCVSS=11"
            "-DnvdMaxRetryCount=10"
          )

          if [ -n "${NVD_API_KEY}" ]; then
            nvd_status="$(
              curl --silent --show-error --location \
                --connect-timeout 10 \
                --max-time 30 \
                --header "apiKey: ${NVD_API_KEY}" \
                --output /dev/null \
                --write-out '%{http_code}' \
                'https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1' || true
            )"

            if [ "${nvd_status}" = "200" ]; then
              dependency_check_args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY" "-DnvdApiDelay=3500")
            else
              echo "::warning::NVD_API_KEY is configured but NVD rejected it or could not validate it (HTTP ${nvd_status:-unknown}). Running Dependency-Check without an API key."
              unset NVD_API_KEY
              dependency_check_args+=("-DnvdApiDelay=8000")
            fi
          else
            dependency_check_args+=("-DnvdApiDelay=8000")
          fi

          if ! ./mvnw "${maven_args[@]}" "${dependency_check_args[@]}"; then
            echo "::warning::OWASP Dependency-Check failed while updating or processing vulnerability data. This is treated as non-blocking because dependency data feed issues can be transient; see the uploaded report if one was generated."
            rm -rf "${HOME}/.dependency-check"
            exit 0
          fi

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  ui-test:
    name: UI Tests
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Selenium UI tests
        shell: bash
        run: |
          set -euo pipefail
          read -r -a maven_args <<< "${MAVEN_CLI_OPTS}"
          ./mvnw "${maven_args[@]}" -Pui-tests verify -Dskip.surefire.tests=true

      - name: Publish UI JUnit test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: UI Test Report
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml
            **/screenshots/**
            **/selenium-screenshots/**
            **/videos/**
            **/recordings/**
            **/html-reports/**
            **/test-output/**
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  visual-test:
    name: Visual Regression Tests
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application jar
        uses: actions/download-artifact@v7
        with:
          name: app-jar-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/app

      - name: Prepare application jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find target/app -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "${jar_path}" ]; then
            echo "No application jar was downloaded."
            exit 1
          fi
          cp "${jar_path}" target/app/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          load: true
          tags: appointmentscheduler:local
          cache-from: type=gha,scope=appointmentscheduler-ci
          cache-to: type=gha,mode=max,scope=appointmentscheduler-ci

      - name: Start application stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for application health... attempt ${attempt}/60"
            sleep 5
          done

          docker compose ps
          docker compose logs backend
          exit 1

      - name: Set up Node.js for visual tests
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Playwright visual test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright visual regression tests
        shell: bash
        env:
          BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          if find tests/visual -path '*-snapshots*' -type f -name '*-linux.png' | grep -q .; then
            npm run test:visual
          else
            echo "::warning::No Linux Playwright visual baselines were found. Recording Linux baseline screenshots for this run."
            npm run test:visual:update
          fi

      - name: Capture application logs
        if: always()
        shell: bash
        run: |
          mkdir -p target/playwright-results
          docker compose logs > target/playwright-results/docker-compose.log

      - name: Stop application stack
        if: always()
        shell: bash
        run: docker compose down -v

      - name: Upload Playwright visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            target/playwright-report
            target/playwright-results
            tests/visual/**/__screenshots__/**
            tests/visual/**/*-snapshots/**
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  image-security-scan:
    name: Container Image Security Scan
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application jar
        uses: actions/download-artifact@v7
        with:
          name: app-jar-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/app

      - name: Prepare application jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find target/app -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "${jar_path}" ]; then
            echo "No application jar was downloaded."
            exit 1
          fi
          cp "${jar_path}" target/app/app.jar

      - name: Build application image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile.ci \
            --tag appointmentscheduler:local \
            .

      - name: Prepare Trivy output directory
        shell: bash
        run: mkdir -p target/trivy

      - name: Run Trivy SARIF image scan
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          image-ref: appointmentscheduler:local
          format: sarif
          output: target/trivy/image-scan.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/trivy/image-scan.sarif

      - name: Run Trivy table image scan
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          image-ref: appointmentscheduler:local
          format: table
          output: target/trivy/image-scan.txt
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-scan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/trivy
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}

  performance-test:
    name: k6 Performance Test
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application jar
        uses: actions/download-artifact@v7
        with:
          name: app-jar-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/app

      - name: Prepare application jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find target/app -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "${jar_path}" ]; then
            echo "No application jar was downloaded."
            exit 1
          fi
          cp "${jar_path}" target/app/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          load: true
          tags: appointmentscheduler:local
          cache-from: type=gha,scope=appointmentscheduler-ci
          cache-to: type=gha,mode=max,scope=appointmentscheduler-ci

      - name: Start application stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for application health... attempt ${attempt}/60"
            sleep 5
          done

          docker compose ps
          docker compose logs backend
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: Prepare k6 output directory
        shell: bash
        run: mkdir -p target/k6 target/k6-baseline

      - name: Restore k6 performance baseline
        uses: actions/cache@v5
        with:
          path: target/k6-baseline
          key: k6-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.k6_profile || 'smoke' }}-${{ github.run_id }}
          restore-keys: |
            k6-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.k6_profile || 'smoke' }}-

      - name: Run k6 smoke load test
        uses: grafana/run-k6-action@v1
        env:
          BASE_URL: http://localhost:8080
          K6_CLEANUP_WRITES: 'true'
          K6_WARM_VUS: ${{ github.event.inputs.k6_warm_vus || '5' }}
          K6_PEAK_VUS: ${{ github.event.inputs.k6_peak_vus || '10' }}
          K6_RAMP_UP_DURATION: ${{ github.event.inputs.k6_ramp_up_duration || '20s' }}
          K6_STEADY_DURATION: ${{ github.event.inputs.k6_steady_duration || '40s' }}
          K6_RAMP_DOWN_DURATION: ${{ github.event.inputs.k6_ramp_down_duration || '20s' }}
          K6_LOAD_DURATION: ${{ github.event.inputs.k6_load_duration || '5m' }}
          K6_CUSTOMER_VUS: ${{ github.event.inputs.k6_customer_vus || '20' }}
          K6_PROVIDER_VUS: ${{ github.event.inputs.k6_provider_vus || '5' }}
          K6_WRITE_VUS: ${{ github.event.inputs.k6_write_vus || '3' }}
        with:
          path: ${{ github.event.inputs.k6_profile == 'load' && 'performance/k6/appointmentscheduler-load.js' || 'performance/k6/appointmentscheduler-smoke.js' }}
          debug: true
          cloud-comment-on-pr: false
          disable-analytics: true

      - name: Publish k6 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f target/k6/summary.json ]; then
            echo "No k6 summary was generated." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "## k6 Performance Summary"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            jq -r '
              def pct($v): if $v == null then "n/a" else (((($v * 10000) | round) / 100) | tostring) + "%" end;
              def ms($v): if $v == null then "n/a" else (((($v * 100) | round) / 100) | tostring) + " ms" end;
              [
                ["HTTP requests", (.metrics.http_reqs.values.count // 0 | tostring)],
                ["Failed request rate", pct(.metrics.http_req_failed.values.rate)],
                ["Check success rate", pct(.metrics.checks.values.rate)],
                ["Avg duration", ms(.metrics.http_req_duration.values.avg)],
                ["P95 duration", ms(.metrics.http_req_duration.values["p(95)"])],
                ["Max duration", ms(.metrics.http_req_duration.values.max)]
              ][] | "| \(.[0]) | \(.[1]) |"
            ' target/k6/summary.json
            if [ -f target/k6/checks.json ]; then
              failed_checks="$(jq '[.[] | select(.fails > 0)] | sort_by(.fails) | reverse | .[:10]' target/k6/checks.json)"
              if [ "${failed_checks}" != "[]" ]; then
                echo
                echo "### Failed checks"
                echo
                echo "| Check | Fails | Passes | Success rate |"
                echo "| --- | ---: | ---: | ---: |"
                jq -r '
                  [.[] | select(.fails > 0)] | sort_by(.fails) | reverse | .[:10][] |
                  "| \(.path // .name) | \(.fails) | \(.passes) | \(((.rate * 10000 | round) / 100) | tostring)% |"
                ' target/k6/checks.json
              fi
            fi
            if [ -f target/k6/http-status.json ]; then
              echo
              echo "### HTTP status distribution"
              echo
              echo "| Status | Count |"
              echo "| --- | ---: |"
              jq -r '.[] | "| \(.status) | \(.count) |"' target/k6/http-status.json
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Compare k6 performance baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f target/k6/metrics.json ]; then
            echo "No k6 metrics were generated for baseline comparison." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          previous_baseline="target/k6-baseline/baseline.json"
          current_metrics="target/k6/metrics.json"

          {
            echo
            echo "## k6 Baseline Comparison"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -f "${previous_baseline}" ]; then
            jq -n \
              --slurpfile previous "${previous_baseline}" \
              --slurpfile current "${current_metrics}" '
              def pct($v): if $v == null then "n/a" else (((($v * 10000) | round) / 100) | tostring) + "%" end;
              def ms($v): if $v == null then "n/a" else (((($v * 100) | round) / 100) | tostring) + " ms" end;
              def num($v): if $v == null then "n/a" else ($v | tostring) end;
              def delta_pct($old; $new):
                if $old == null or $old == 0 or $new == null then "n/a" else (((((($new - $old) / $old) * 10000) | round) / 100) | tostring) + "%" end;
              def delta_num($old; $new):
                if $old == null or $new == null then "n/a" else (($new - $old) | tostring) end;
              def delta_ms($old; $new):
                if $old == null or $new == null then "n/a" else ms($new - $old) end;
              def delta_rate($old; $new):
                if $old == null or $new == null then "n/a" else pct($new - $old) end;
              ($previous[0]) as $p |
              ($current[0]) as $c |
              [
                ["HTTP requests", num($p.http_reqs), num($c.http_reqs), delta_num($p.http_reqs; $c.http_reqs), delta_pct($p.http_reqs; $c.http_reqs)],
                ["Failed request rate", pct($p.http_req_failed_rate), pct($c.http_req_failed_rate), delta_rate($p.http_req_failed_rate; $c.http_req_failed_rate), "n/a"],
                ["Check success rate", pct($p.checks_rate), pct($c.checks_rate), delta_rate($p.checks_rate; $c.checks_rate), "n/a"],
                ["Avg duration", ms($p.http_req_duration_avg_ms), ms($c.http_req_duration_avg_ms), delta_ms($p.http_req_duration_avg_ms; $c.http_req_duration_avg_ms), delta_pct($p.http_req_duration_avg_ms; $c.http_req_duration_avg_ms)],
                ["P90 duration", ms($p.http_req_duration_p90_ms), ms($c.http_req_duration_p90_ms), delta_ms($p.http_req_duration_p90_ms; $c.http_req_duration_p90_ms), delta_pct($p.http_req_duration_p90_ms; $c.http_req_duration_p90_ms)],
                ["P95 duration", ms($p.http_req_duration_p95_ms), ms($c.http_req_duration_p95_ms), delta_ms($p.http_req_duration_p95_ms; $c.http_req_duration_p95_ms), delta_pct($p.http_req_duration_p95_ms; $c.http_req_duration_p95_ms)]
              ] as $rows |
              "| Metric | Previous | Current | Delta | Delta % |\n| --- | ---: | ---: | ---: | ---: |\n" +
              ($rows | map("| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) | \(.[4]) |") | join("\n"))
            ' -r >> "${GITHUB_STEP_SUMMARY}"

            p95_regressed="$(jq -n --slurpfile previous "${previous_baseline}" --slurpfile current "${current_metrics}" '($previous[0].http_req_duration_p95_ms // 0) as $p | ($current[0].http_req_duration_p95_ms // 0) as $c | $p > 0 and $c > ($p * 1.2)')"
            failed_regressed="$(jq -n --slurpfile previous "${previous_baseline}" --slurpfile current "${current_metrics}" '($previous[0].http_req_failed_rate // 0) as $p | ($current[0].http_req_failed_rate // 0) as $c | $c > ($p + 0.01)')"

            if [ "${p95_regressed}" = "true" ]; then
              echo "::warning::k6 P95 latency regressed by more than 20% compared with the previous baseline."
            fi
            if [ "${failed_regressed}" = "true" ]; then
              echo "::warning::k6 failed request rate increased by more than 1 percentage point compared with the previous baseline."
            fi
          else
            echo "No previous k6 baseline was restored. This run will become the new baseline." >> "${GITHUB_STEP_SUMMARY}"
          fi

          cp "${current_metrics}" "${previous_baseline}"

      - name: Capture application logs
        if: always()
        shell: bash
        run: |
          mkdir -p target/k6
          docker compose logs > target/k6/docker-compose.log

      - name: Stop application stack
        if: always()
        shell: bash
        run: docker compose down -v

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/k6
          if-no-files-found: warn
          retention-days: ${{ env.TEST_REPORT_RETENTION_DAYS }}
