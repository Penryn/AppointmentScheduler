# Maven
# Build and test on pushes/PRs, then publish container image from master.

trigger:
  branches:
    include:
      - develop
      - master
  paths:
    exclude:
      - docs/**
      - output/**
      - target/**
      - README.md
      - LICENSE.md

pr:
  branches:
    include:
      - develop
      - master
  paths:
    exclude:
      - docs/**
      - output/**
      - target/**
      - README.md
      - LICENSE.md

variables:
  vmImageName: 'ubuntu-latest'
  mavenCacheFolder: '$(Pipeline.Workspace)/.m2/repository'
  mavenCommonOptions: '-Dmaven.repo.local=$(mavenCacheFolder)'
  jacocoRetentionDays: '30'
  jacocoArtifactPrefix: 'jacoco-report'

stages:
  - stage: CI
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Verify with Maven'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Cache@2
            displayName: 'Cache Maven local repository'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: '$(mavenCacheFolder)'

          - task: Maven@4
            displayName: 'Run unit and integration tests'
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              options: '$(mavenCommonOptions)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: |
                **/surefire-reports/TEST-*.xml
                **/failsafe-reports/TEST-*.xml
              goals: 'verify'

          - bash: |
              set -euo pipefail
              branch_safe="$(echo "$(Build.SourceBranchName)" | tr '/ ' '--' | tr -cd '[:alnum:]._-')"
              if [ -z "$branch_safe" ]; then
                branch_safe="unknown-branch"
              fi
              short_sha="$(echo "$(Build.SourceVersion)" | cut -c1-8)"
              artifact_name="$(jacocoArtifactPrefix)-${branch_safe}-b$(Build.BuildId)-${short_sha}"
              echo "##vso[task.setvariable variable=jacocoArtifactName]${artifact_name}"
              echo "JaCoCo artifact name: ${artifact_name}"
            displayName: 'Normalize JaCoCo artifact name'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish JaCoCo report artifact'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/target/site/jacoco'
              artifact: '$(jacocoArtifactName)'
              publishLocation: 'pipeline'

          # Keep this run for a fixed number of days so the JaCoCo artifact is retained.
          - bash: |
              set -euo pipefail
              if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
                echo "##vso[task.logissue type=warning]SYSTEM_ACCESSTOKEN 不可用，已跳过保留租约设置。"
                exit 0
              fi

              api_url="$(System.CollectionUri)$(System.TeamProject)/_apis/build/retention/leases?api-version=7.1-preview.2"
              payload=$(cat <<EOF
              [
                {
                  "daysValid": $(jacocoRetentionDays),
                  "definitionId": $(System.DefinitionId),
                  "ownerId": "User:$(Build.RequestedForId)",
                  "protectPipeline": false,
                  "runId": $(Build.BuildId)
                }
              ]
              EOF
              )

              http_code=$(curl -sS -o retention-response.json -w "%{http_code}" \
                -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                -d "$payload" \
                "$api_url")

              if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                echo "##vso[task.logissue type=warning]保留租约设置失败(HTTP ${http_code})，请检查 Build Service 权限。"
                cat retention-response.json || true
                exit 0
              fi

              echo "Retention lease created for $(jacocoRetentionDays) days."
            displayName: 'Set run retention lease for JaCoCo artifact'
            condition: succeededOrFailed()
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: PublishImage
    displayName: 'Publish Docker Image'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: BuildAndPushImage
        displayName: 'Build and push with Jib'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Cache@2
            displayName: 'Cache Maven local repository'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: '$(mavenCacheFolder)'

          - task: Maven@4
            displayName: 'Build and push image'
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              options: '$(mavenCommonOptions) -Djib.to.auth.username=$(dockerRegistryUsername) -Djib.to.auth.password=$(dockerRegistryPassword) -Djib.to.tags=latest,$(Build.BuildId),$(Build.SourceVersion)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              goals: 'jib:build'
